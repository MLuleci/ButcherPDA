# Target devices run Android 6.0 (API 23). AndroidX releases from July 2026 onward
# default to minSdk 24 (e.g. Navigation 2.10+), so check the minSdkVersion in an
# artifact's AAR manifest before bumping any version here.
[versions]
activityCompose = "1.13.0"
agp = "9.2.1"
androidxJunit = "1.3.0"
coilCompose = "2.7.0"
coilComposeVersion = "2.7.0"
composeBom = "2026.09.00"
composeBomVersion = "2026.09.00"
coreKtx = "1.19.1"
coreKtxVersion = "1.19.1"
datastore = "1.2.1"
datastorePreferences = "1.2.1"
espressoCoreVersion = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
kotlinxCoroutinesTest = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
material = "1.14.0"
okhttp = "5.5.0"
desugarJdkLibs = "2.1.5"
preferenceKtx = "1.2.1"
retrofit = "3.0.0"
retrofit2KotlinxSerializationConverter = "1.0.0"
kotlin = "2.4.21"
datastoreCore = "1.2.1"
navigationRuntimeKtx = "2.9.8"
navigationCompose = "2.9.8"
uiText = "1.12.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
